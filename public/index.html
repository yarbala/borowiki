<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гроза над лесом</title>
<meta name="theme-color" content="#EDEAE3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpolygon points='12.5,1.5 4,11.5 9.5,11.5 7.5,18.5 16,8.5 10.5,8.5' fill='%236B4EE6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="screen">
  <div id="map" aria-label="Карта OSM"></div>

  <!-- Верх: переключатель горизонта, легенда, настройки -->
  <div class="top">
    <button type="button" class="icon-btn" id="historyBtn" title="Посмотреть состояние на прошлую дату" aria-label="История">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4.5" width="14" height="12.5" rx="2.5"/><line x1="3" y1="8" x2="17" y2="8"/><line x1="7" y1="2.5" x2="7" y2="5"/><line x1="13" y1="2.5" x2="13" y2="5"/></svg>
    </button>
    <div class="top-center">


      <div class="date-badge" id="dateBadge" hidden>
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="14" height="12.5" rx="2.5"/><line x1="3" y1="8" x2="17" y2="8"/></svg>
        <span id="dateBadgeText"></span>
        <button type="button" id="dateBadgeClose" title="Вернуться к сегодня" aria-label="Вернуться к сегодня">×</button>
      </div>

      <div class="pick-bar" id="pickBar" hidden>
        Нажмите на карту — здесь будет дом
        <button type="button" id="cancelPick">Отмена</button>
      </div>

      <div class="legend" id="legend" title="Чем свежее событие, тем насыщеннее метка">
        <span class="ramp-label">только что</span>
        <span class="ramps">
          <span class="ramp storm"></span>
          <span class="ramp rain" id="rainRamp" hidden></span>
        </span>
        <span class="ramp-label">7 дней</span>
      </div>
    </div>
    <button type="button" class="icon-btn" id="settingsBtn" title="Настройки: дом и радиус" aria-label="Настройки">
      <svg width="20" height="20" class="ico-settings"><line x1="3" y1="6.5" x2="17" y2="6.5"></line><line x1="3" y1="13.5" x2="17" y2="13.5"></line><circle cx="8" cy="6.5" r="2.4"></circle><circle cx="12.5" cy="13.5" r="2.4"></circle></svg>
    </button>
  </div>

  <!-- Низ: кнопки и выдвижная панель -->
  <div class="bottom">
    <div class="fabs">
      <button type="button" class="icon-btn" id="rainBtn" title="Самый сильный дождь за окно — по всему региону, включая места без молний" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2.5C10 2.5 4.5 9 4.5 12.3a5.5 5.5 0 0 0 11 0C15.5 9 10 2.5 10 2.5z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon-btn" id="strikesBtn" title="Все разряды молний за 7 дней, включая поля" aria-pressed="false">
        <svg width="20" height="20"><polygon points="12.5,1.5 4,11.5 9.5,11.5 7.5,18.5 16,8.5 10.5,8.5" fill="currentColor"></polygon></svg>
      </button>
      <button type="button" class="icon-btn" id="locateBtn" title="Моё местоположение">
        <svg width="20" height="20" class="ico-locate"><circle cx="10" cy="10" r="6.5"></circle><circle cx="10" cy="10" r="2" class="dot"></circle><line x1="10" y1="1" x2="10" y2="3.5"></line><line x1="10" y1="16.5" x2="10" y2="19"></line><line x1="1" y1="10" x2="3.5" y2="10"></line><line x1="16.5" y1="10" x2="19" y2="10"></line></svg>
      </button>
    </div>

    <div class="sheet">
      <div class="grabber"><div></div></div>

      <button type="button" class="sheet-handle" id="sheetHandle" aria-expanded="false">
        <span class="sheet-handle-text">
          <span class="t" id="topTitle">Гроза над лесом</span>
          <span class="s" id="topSub"></span>
        </span>
        <span class="chev" id="chev"></span>
      </button>

      <div class="list" id="list" hidden></div>

      <div class="card" id="card" hidden></div>

      <div class="statusbar">
        <span class="status" id="status"><i></i><span id="statusText">загрузка…</span></span>
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" id="credit">© OpenStreetMap</a>
      </div>
    </div>
  </div>

  <!-- История -->
  <div class="modal" id="history" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="История">
      <div class="modal-head">
        <span class="modal-title">История</span>
        <button type="button" class="close-btn" id="closeHistory" title="Закрыть" aria-label="Закрыть">×</button>
      </div>

      <div class="field">
        <span class="field-label">Состояние на дату</span>
        <div class="search-row">
          <input type="date" id="historyDate">
          <button type="button" class="linkbtn" id="showHistory">Показать</button>
        </div>
        <div class="note" id="historyNote"></div>
      </div>

      <div class="field" id="historyListBox" hidden>
        <span class="field-label">Уже собрано</span>
        <div class="chips" id="historyList"></div>
      </div>

      <button type="button" class="primary" id="backToToday">Вернуться к сегодня</button>
    </div>
  </div>

  <!-- Настройки -->
  <div class="modal" id="settings" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Настройки">
      <div class="modal-head">
        <span class="modal-title">Настройки</span>
        <button type="button" class="close-btn" id="closeSettings" title="Закрыть" aria-label="Закрыть">×</button>
      </div>

      <div class="field">
        <span class="field-label">Домашняя точка</span>
        <div class="search-row">
          <input type="text" id="homeLabel" placeholder="Город или адрес — Enter для поиска" autocomplete="off">
          <button type="button" class="linkbtn" id="findHome">Найти</button>
        </div>
        <div class="field-row">
          <span class="coords" id="homeCoords"></span>
          <button type="button" class="linkbtn" id="startPick">Указать на карте</button>
        </div>
        <div class="note" id="regionNote"></div>
      </div>

      <div class="field">
        <div class="field-row baseline">
          <span class="field-label">Радиус поиска</span>
          <span class="field-value" id="radiusLabel"></span>
        </div>
        <input type="range" id="radius" min="20" max="200" step="10">
        <div class="field-row small"><span>20 км</span><span>200 км</span></div>
      </div>

      <button type="button" class="primary" id="saveSettings">Готово</button>
      <div class="footnote">Хранится в браузере. Аккаунт не нужен.</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="./app.js" type="module"></script>
</body>
</html>
